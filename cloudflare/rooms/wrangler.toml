name = "vspickleball-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

# Only /rooms/* goes to the Worker; every other vspickleball.com URL still goes to the VPS.
routes = [
  { pattern = "vspickleball.com/rooms/*", zone_name = "vspickleball.com" }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
